name: Publish result
description: Commits results/{request_id}.json to the dedicated 'results' branch, and merges any pending manifest entry into releases/manifest.json
inputs:
  request_id:
    required: true
    description: The request ID whose result file should be published

runs:
  using: composite
  steps:
    - shell: bash
      env:
        REQUEST_ID: ${{ inputs.request_id }}
      run: |
        set -euo pipefail

        if [ ! -f "results/${REQUEST_ID}.json" ]; then
          echo "No result file found at results/${REQUEST_ID}.json — the script likely failed before writing one."
          echo "Check the previous step's logs for the actual error."
          exit 1
        fi

        git config user.email "actions@github.com"
        git config user.name "github-actions[bot]"

        # Stash files we need before switching branches
        cp "results/${REQUEST_ID}.json" "/tmp/${REQUEST_ID}.json"
        if [ -f "releases/pending.json" ]; then
          cp "releases/pending.json" "/tmp/manifest-pending.json"
        fi
        if [ -f "releases/pending-state.json" ]; then
          cp "releases/pending-state.json" "/tmp/state-pending.json"
        fi

        git fetch origin results:results 2>/dev/null || true

        if git show-ref --verify --quiet refs/heads/results; then
          git checkout results
        else
          git checkout --orphan results
          git rm -rf . > /dev/null 2>&1 || true
        fi

        mkdir -p results
        cp "/tmp/${REQUEST_ID}.json" "results/${REQUEST_ID}.json"
        git add "results/${REQUEST_ID}.json"

        # Merge pending manifest entry into releases/manifest.json if present
        if [ -f "/tmp/manifest-pending.json" ]; then
          mkdir -p releases
          NEW_ENTRY=$(cat /tmp/manifest-pending.json)
          NEW_ID=$(echo "$NEW_ENTRY" | jq -r '.releaseId')
          if [ -f "releases/manifest.json" ]; then
            jq --argjson new "$NEW_ENTRY" --arg id "$NEW_ID" \
              '(map(select(.releaseId != $id)) + [$new]) | sort_by(.releaseDateISO)' \
              releases/manifest.json > /tmp/manifest-merged.json
          else
            echo "[$NEW_ENTRY]" | jq 'sort_by(.releaseDateISO)' > /tmp/manifest-merged.json
          fi
          cp /tmp/manifest-merged.json releases/manifest.json
          git add "releases/manifest.json"
        fi

        # Merge pending state into state/{catalogueNumber}.json if present
        if [ -f "/tmp/state-pending.json" ]; then
          mkdir -p state
          CAT=$(jq -r '.catalogueNumber' /tmp/state-pending.json)
          STATE_FILE="state/${CAT}.json"
          if [ -f "$STATE_FILE" ]; then
            jq -s '.[0] * .[1]' "$STATE_FILE" /tmp/state-pending.json > /tmp/state-merged.json
          else
            cp /tmp/state-pending.json /tmp/state-merged.json
          fi
          cp /tmp/state-merged.json "$STATE_FILE"
          git add "$STATE_FILE"
        fi

        git commit -m "Result for ${REQUEST_ID}"
        git push origin results
