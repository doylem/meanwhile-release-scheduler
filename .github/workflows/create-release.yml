name: Create Release

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON payload: { release, mode, emailRemindersEnabled }"
        required: true
      request_id:
        description: "Request ID generated by the frontend — used as the result filename"
        required: true
      dry_run:
        description: "If 'true', logs intended actions without calling Google Calendar"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run create-release script
        env:
          PAYLOAD_JSON: ${{ github.event.inputs.payload }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GAVIN_EMAIL: ${{ secrets.GAVIN_EMAIL }}
          MATTY_EMAIL: ${{ secrets.MATTY_EMAIL }}
          JAMES_EMAIL: ${{ secrets.JAMES_EMAIL }}
          ATTENDEE_EMAILS: ${{ secrets.ATTENDEE_EMAILS }}
        run: npx tsx scripts/create-release.ts

      - name: Publish result to results branch
        uses: ./.github/actions/publish-result
        with:
          request_id: ${{ github.event.inputs.request_id }}
